[package]
name = "tvmv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native Linux Markdown viewer — GTK4 + WebKitGTK shell over the shared TVMV web layer"

[lib]
name = "tvmv"
path = "src/lib.rs"
# cdylib exports the C ABI in src/capi.rs, which the KDE thumbnail plugin links
# against so it draws the same card as the freedesktop thumbnailer.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tvmv"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
async-channel = "2.5.0"
cairo-rs = { version = "0.22", features = ["png"] }
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_14"] }   # matches system GTK 4.14.5
notify = "8.2.0"
pangocairo = "0.22"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
webkit6 = { version = "0.6.1", features = ["v2_52"] }  # matches system WebKitGTK 2.52.3
