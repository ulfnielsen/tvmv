name: TVMV
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  tvmv:
    path: ..
targets:
  TVMV:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: tvmv
        product: TVMVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.dyregod.tvmv.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 9LTFHV87LB
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TVMV
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
  TVMVTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TVMV
  TVMVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TVMV
